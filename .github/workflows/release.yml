name: release

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - 
        name: Get Version
        id: get_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v?(\d+)\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag)
          if not match:
              raise SystemExit("Release tag must be a semantic version, optionally prefixed with v.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={tag}", file=output)
              print(f"major={match.group(1)}", file=output)
          PY
      -
        name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: toddrob/searcharr:${{steps.get_version.outputs.version}},toddrob/searcharr:v${{steps.get_version.outputs.major}},toddrob/searcharr:latest
